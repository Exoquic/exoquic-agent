# SLF4J Simple configuration

# Default log level
org.slf4j.simpleLogger.defaultLogLevel=info

# Log level for specific packages
org.slf4j.simpleLogger.log.com.exoquic=info
org.slf4j.simpleLogger.log.io.debezium=info
org.slf4j.simpleLogger.log.io.debezium.connector.postgresql=info
org.slf4j.simpleLogger.log.org.apache.kafka=warn

# Show thread name
org.slf4j.simpleLogger.showThreadName=true

# Show datetime
org.slf4j.simpleLogger.showDateTime=true

# Datetime format
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS

# Show log name
org.slf4j.simpleLogger.showLogName=true

# Show short log name
org.slf4j.simpleLogger.showShortLogName=false

# Use level in output
org.slf4j.simpleLogger.levelInBrackets=true

# Standard output vs error
org.slf4j.simpleLogger.warnLevelString=WARN
org.slf4j.simpleLogger.logFile=System.out
